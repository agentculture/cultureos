# CultureOS: arm the qcom_wdt hardware watchdog from PID 1 (decision c39,
# docs/os/rollback.md). qcom_wdt is /dev/watchdog0 with a 30 s default
# timeout; systemd programs the timeout below and pets it at half of it. If
# user space stops (hang, panic after PID 1 armed it) the board resets.
#
# Drop-ins override /etc/systemd/system.conf, where meta-qcom-distro already
# sets RuntimeWatchdogSec=30 (WATCHDOG_RUNTIME_SEC); this pins the value under
# the hardware timeout independent of that.
[Manager]
WatchdogDevice=/dev/watchdog0
RuntimeWatchdogSec=20s
RebootWatchdogSec=60s
