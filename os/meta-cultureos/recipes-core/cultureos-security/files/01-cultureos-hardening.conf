# CultureOS sshd hardening (cultureos-security, plan task t12).
#
# Key-only login, no root login. sshd uses the FIRST value it sees for each
# keyword, and the upstream /etc/ssh/sshd_config starts with
# "Include /etc/ssh/sshd_config.d/*.conf" (read in lexical order) before its
# own "PermitRootLogin yes" / "PermitEmptyPasswords yes". The 01- prefix makes
# this file the first one read, so these values win over everything after it.
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitEmptyPasswords no
PermitRootLogin no
PubkeyAuthentication yes
AuthenticationMethods publickey
