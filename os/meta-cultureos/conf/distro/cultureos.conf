# CultureOS: the upstream OTA-enabled Qualcomm reference distro with no
# Uptane client.
#
# qcom-distro-sota requires meta-updater's conf/distro/sota.conf.inc, which
# imposes (meta-updater 0681742):
#   - DISTRO_FEATURES += "sota usrmerge", INHERIT += "sota"
#   - sota.bbclass: IMAGE_INSTALL += ${SOTA_CLIENT} (default "aktualizr"),
#     aktualizr-info and ${SOTA_CLIENT_PROV} (default aktualizr-shared-prov),
#     plus ostree, ostree-kernel, ostree-initramfs
#   - image types ota-ext4 (+ ostreecommit.tar.zst when
#     BUILD_OSTREE_REPO_TARBALL = "1", which qcom-distro-sota sets)
#   - garage-sign push image types, only when SOTA_PACKED_CREDENTIALS is set
#   - sota_qcom.bbclass: OSTREE_BOOTLOADER ?= "systemd-boot" and
#     EFI_PROVIDER:sota = systemd-boot (kept as is, decision c39), OSTree boot
#     counting (sysroot.boot-counting-tries:3)
#
# Decision c35: updates are a plain signed OSTree pull, no Uptane. So the
# client and its provisioning package are emptied here, which also drops
# aktualizr-info (it is added only when SOTA_CLIENT == "aktualizr").

require conf/distro/qcom-distro-sota.conf

DISTRO_NAME = "CultureOS"

# No Uptane client, no aktualizr provisioning, no credentials in the image.
SOTA_CLIENT = ""
SOTA_CLIENT_PROV = ""
SOTA_DEPLOY_CREDENTIALS = "0"
# No SOTA_PACKED_CREDENTIALS (no garage push); silence the warning about it.
SOTA_SKIP_CRED_WARN = "1"

# OSTree stateroot name on the device.
OSTREE_OSNAME = "cultureos"

# Trial-boot rollback: panic=N on the OSTree kernel command line (t15).
require conf/distro/include/cultureos-trialboot.inc
