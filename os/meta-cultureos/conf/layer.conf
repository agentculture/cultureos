# meta-cultureos: the CultureOS distro and image for the Arduino VENTUNO Q.
# Stacked on meta-qcom-arduino (machine ventuno-q) and meta-qcom-distro
# (distro qcom-distro-sota, which pulls in meta-updater). See
# docs/os/building.md.

BBPATH .= ":${LAYERDIR}"

BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "cultureos"
BBFILE_PATTERN_cultureos := "^${LAYERDIR}/"
BBFILE_PRIORITY_cultureos = "20"

LAYERDEPENDS_cultureos = " \
    core \
    qcom \
    qcom-arduino \
    qcom-distro \
    sota \
"

LAYERSERIES_COMPAT_cultureos = "blacksail"
